name: Test and deploy Shinylive

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shinylive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RENV_CONFIG_PAK_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: "4.6.1"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev libcurl4-openssl-dev libssl-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build-library
          key: r-build-ubuntu24-r4.6.1-${{ hashFiles('scripts/renv.lock', 'scripts/setup-build.R') }}
      - name: Restore isolated R library
        run: Rscript scripts/setup-build.R
      - name: Run native tests
        run: Rscript scripts/test-native.R
      - name: Export and verify Wasm artifacts
        run: Rscript scripts/export-shinylive.R
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test the static site in desktop and mobile Chromium
        run: npm run test:browser -- --project=desktop --project=mobile
      - name: Upload diagnostics and version manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            tests/browser/artifacts/
            site/build-info.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload site for WebKit testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shinylive-site
          path: site
          include-hidden-files: true
          retention-days: 1

  webkit:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shinylive-site
          path: site
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Test Safari rendering on macOS WebKit
        run: npm run test:browser:webkit
      - name: Upload WebKit diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-diagnostics
          path: tests/browser/artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload cross-browser-tested Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: [build, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
